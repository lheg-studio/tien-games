<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#08091b">
<title>Administración | TIEN GAMES</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08091b;color:#fff;font-family:Arial,sans-serif;padding:16px}
main{max-width:1100px;margin:35px auto}
.card{background:#11152c;border:1px solid #29335e;border-radius:16px;padding:22px;margin-bottom:18px}
h1{color:#65a5ff;margin-top:0}
h2{font-size:20px}
.muted{color:#aab5d1}
input,button,select{width:100%;padding:13px;margin:7px 0;border-radius:9px;border:1px solid #34436d}
input,select{background:#090e20;color:white}
button{background:#1769e0;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.hidden{display:none!important}
.admin-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.admin-tabs button{margin:0}
.admin-tabs button.active{background:#284b83;border-color:#65a5ff}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.top button{width:auto;min-width:130px}
.order{padding:17px 0;border-bottom:1px solid #303956}
.order:last-child{border-bottom:0}
.order p{margin:7px 0;overflow-wrap:anywhere}
.order strong{color:#8dbaff}
.order select{max-width:300px}
.reference{font-size:12px;color:#9eb1d8;overflow-wrap:anywhere}
.status{font-weight:bold;color:#8dbaff}
.error{color:#ff8b8b}
.success{color:#80e6a2}
.small{font-size:13px}
@media(min-width:650px){.login-card{max-width:470px;margin:60px auto}}
</style>
<link rel="stylesheet" href="css/admin-glass.css">
</head>
<body>
<main>
<section class="card login-card" id="login">
<h1>TIEN GAMES</h1>
<p class="muted">Panel de administración</p>
<form id="loginForm">
<input id="email" type="email" placeholder="Correo administrativo" required autocomplete="username">
<input id="password" type="password" placeholder="Contraseña" required autocomplete="current-password">
<button id="loginButton" type="submit">Iniciar sesión</button>
</form>
<p id="message" class="muted"></p>
</section>

<section class="hidden" id="dashboard">
<div class="card">
<div class="top">
<div>
<h1>Panel administrativo</h1>
<p class="muted">Gestión de pedidos de TIEN GAMES</p>
</div>
<button id="logout" type="button">Cerrar sesión</button>
</div>
<p id="adminMessage" class="muted"></p>
</div>

<nav class="admin-tabs" aria-label="Secciones administrativas">
  <button id="ordersTabButton" class="active" type="button">PEDIDOS</button>
  <button id="productsTabButton" type="button">PRODUCTOS</button>
</nav>

<section id="ordersTab">
<div class="card">
<div class="top">
<h2>Pedidos registrados</h2>
<button id="refresh" type="button">Actualizar</button>
</div>
<input id="search" type="search" placeholder="Buscar por cliente, referencia o juego...">
<p id="count" class="muted small"></p>
<div id="orders">Cargando pedidos...</div>
</div>

</section>

<section id="productsTab" class="hidden">
<div class="card" id="productsModule">
  <div class="top">
    <div>
      <h2>Gestión de productos</h2>
      <p class="muted small">Administrá los paquetes y sus precios.</p>
    </div>
    <button id="refreshProducts" type="button">Actualizar productos</button>
  </div>

  <form id="productForm">
    <input id="productId" type="hidden">

    <label for="productGame">Juego</label>
    <select id="productGame" required>
      <option value="free-fire">Free Fire</option>
      <option value="blood-strike">Blood Strike</option>
      <option value="pubg-mobile">PUBG Mobile</option>
      <option value="roblox">Roblox</option>
    </select>

    <label for="productName">Nombre del paquete</label>
    <input id="productName" maxlength="100" required
      placeholder="Ej.: 110 diamantes">

    <label for="productPrice">Precio en guaraníes</label>
    <input id="productPrice" type="number" min="1" step="1"
      required placeholder="Ej.: 7200">

    <button id="saveProduct" type="submit">Agregar producto</button>
    <button id="cancelProductEdit" type="button" class="hidden">
      Cancelar edición
    </button>
  </form>

  <p id="productMessage" class="muted small"></p>
  <p id="productCount" class="muted small"></p>
  <div id="productsList">Cargando productos...</div>
</div>
</section>
</section>
</main>

<script>
(() => {
const db = window.tgSupabase;
const login = document.getElementById("login");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");
const area = document.getElementById("orders");
const count = document.getElementById("count");
const search = document.getElementById("search");
const loginButton = document.getElementById("loginButton");

let orders = [];
const states = ["pendiente","en proceso","entregado","cancelado"];

function escapeText(value){
  return String(value ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function formatDate(value){
  if(!value) return "Fecha no disponible";
  const date = new Date(value);
  if(Number.isNaN(date.getTime())) return "Fecha no disponible";
  return date.toLocaleString("es-PY");
}

async function verifyAdmin(){
  const {data:{user},error:userError} = await db.auth.getUser();
  if(userError || !user) return false;

  const {data,error} = await db
    .from("Administradores")
    .select("Usuario_id")
    .eq("Usuario_id",user.id)
    .maybeSingle();

  return !error && !!data;
}

function renderOrders(){
  const term = search.value.trim().toLowerCase();
  const filtered = orders.filter(p => [
    p.id,p.cliente_nombre,p.cliente_contacto,p.juego,p.paquete,p.jugador_id,p.estado
  ].some(value => String(value ?? "").toLowerCase().includes(term)));

  count.textContent = `${filtered.length} pedido(s) encontrado(s) · ${orders.length} en total`;

  if(!filtered.length){
    area.textContent = orders.length
      ? "No hay pedidos que coincidan con la búsqueda."
      : "Todavía no hay pedidos registrados.";
    return;
  }

  area.innerHTML = filtered.map(p => `
    <article class="order">
      <p><strong>${escapeText(p.cliente_nombre)}</strong></p>
      <p class="reference">Referencia: ${escapeText(p.id)}</p>
      <p class="muted small">Fecha: ${escapeText(formatDate(p.created_at))}</p>
      <p>${escapeText(p.juego)} — ${escapeText(p.paquete)}</p>
      <p><strong>Gs. ${Number(p.precio).toLocaleString("es-PY")}</strong></p>
      <p>Contacto: ${escapeText(p.cliente_contacto || "No indicado")}</p>
      <p>ID de jugador: ${escapeText(p.jugador_id || "No corresponde")}</p>
      <p class="status">Estado: ${escapeText(p.estado)}</p>
      <label for="state-${escapeText(p.id)}" class="small muted">Cambiar estado:</label>
      <select id="state-${escapeText(p.id)}" data-order-id="${escapeText(p.id)}">
        ${states.map(s => `
          <option value="${s}" ${p.estado === s ? "selected" : ""}>${s.toUpperCase()}</option>
        `).join("")}
      </select>
      <button type="button" data-save-id="${escapeText(p.id)}">Guardar estado</button>
      <p class="small" id="result-${escapeText(p.id)}"></p>
    </article>
  `).join("");
}

async function loadOrders(){
  area.textContent = "Cargando pedidos...";
  document.getElementById("refresh").disabled = true;

  const {data,error} = await db
    .from("pedidos")
    .select("*")
    .order("created_at",{ascending:false});

  document.getElementById("refresh").disabled = false;

  if(error){
    area.textContent = "No se pudieron cargar los pedidos. Verificá tu conexión y los permisos de administrador.";
    console.error(error);
    return;
  }

  orders = data || [];
  renderOrders();
}

async function showDashboard(){
  login.classList.add("hidden");
  dashboard.classList.remove("hidden");
  await loadOrders();
  await loadProducts();
}

document.getElementById("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();

  if(!db){
    message.textContent = "No se pudo iniciar la conexión con Supabase.";
    return;
  }

  loginButton.disabled = true;
  message.textContent = "Verificando acceso...";

  const {error} = await db.auth.signInWithPassword({
    email:document.getElementById("email").value.trim(),
    password:document.getElementById("password").value
  });

  if(error){
    message.textContent = "No se pudo iniciar sesión. Revisá tus datos.";
    loginButton.disabled = false;
    return;
  }

  if(!await verifyAdmin()){
    await db.auth.signOut();
    message.textContent = "Acceso denegado. Usuario no autorizado.";
    loginButton.disabled = false;
    return;
  }

  await showDashboard();
});

document.getElementById("logout").addEventListener("click",async()=>{
  await db.auth.signOut();
  location.reload();
});

document.getElementById("refresh").addEventListener("click",loadOrders);
search.addEventListener("input",renderOrders);

area.addEventListener("click",async e=>{
  const button = e.target.closest("[data-save-id]");
  if(!button) return;

  const id = button.dataset.saveId;
  const select = area.querySelector(`[data-order-id="${CSS.escape(id)}"]`);
  const result = document.getElementById(`result-${CSS.escape(id)}`);
  const newState = select.value;

  if(!states.includes(newState)) return;

  button.disabled = true;
  result.textContent = "Guardando...";
  result.className = "small muted";

  const {error} = await db
    .from("pedidos")
    .update({estado:newState})
    .eq("id",id);

  button.disabled = false;

  if(error){
    result.textContent = "No se pudo actualizar. Revisá los permisos.";
    result.className = "small error";
    console.error(error);
    return;
  }

  result.textContent = "Estado actualizado correctamente.";
  result.className = "small success";
  await loadOrders();
});

const productForm = document.getElementById("productForm");
const productMessage = document.getElementById("productMessage");
const productsList = document.getElementById("productsList");
const productCount = document.getElementById("productCount");
const saveProduct = document.getElementById("saveProduct");

let products = [];

function showProductMessage(text, type="muted"){
  productMessage.textContent = text;
  productMessage.className = "small " + type;
}

function renderProducts(){
  const sorted = [...products].sort((a,b) =>
    a.juego.localeCompare(b.juego) || a.paquete.localeCompare(b.paquete)
  );

  productCount.textContent = `${products.length} producto(s) registrados`;

  if(!sorted.length){
    productsList.textContent = "Todavía no hay productos.";
    return;
  }

  productsList.innerHTML = sorted.map(p => `
    <article class="order">
      <p><strong>${escapeText(p.juego.toUpperCase())}</strong></p>
      <p>${escapeText(p.paquete)}</p>
      <p><strong>Gs. ${Number(p.precio).toLocaleString("es-PY")}</strong></p>
      <p class="status">${p.activo ? "ACTIVO" : "DESACTIVADO"}</p>
      <button type="button" data-edit-product="${escapeText(p.id)}">
        Editar
      </button>
      <button type="button" data-toggle-product="${escapeText(p.id)}">
        ${p.activo ? "Desactivar" : "Activar"}
      </button>
    </article>
  `).join("");
}

async function loadProducts(){
  productsList.textContent = "Cargando productos...";
  document.getElementById("refreshProducts").disabled = true;

  const {data,error} = await db
    .from("productos")
    .select("id,juego,paquete,precio,activo,created_at")
    .order("juego")
    .order("paquete");

  document.getElementById("refreshProducts").disabled = false;

  if(error){
    productsList.textContent = "No se pudieron cargar los productos. Verificá los permisos de Supabase.";
    console.error("Error al cargar productos:", error);
    return;
  }

  products = data || [];
  renderProducts();
}

function resetProductForm(){
  productForm.reset();
  document.getElementById("productId").value = "";
  document.getElementById("saveProduct").textContent = "Agregar producto";
  document.getElementById("cancelProductEdit").classList.add("hidden");
}

productForm.addEventListener("submit", async e => {
  e.preventDefault();

  const id = document.getElementById("productId").value;
  const juego = document.getElementById("productGame").value;
  const paquete = document.getElementById("productName").value.trim();
  const precio = Number(document.getElementById("productPrice").value);

  if(!["free-fire","blood-strike","pubg-mobile","roblox"].includes(juego)){
    showProductMessage("Seleccioná un juego válido.", "error");
    return;
  }

  if(!paquete || paquete.length > 100 || !Number.isSafeInteger(precio) || precio <= 0){
    showProductMessage("Ingresá un paquete y un precio válido.", "error");
    return;
  }

  saveProduct.disabled = true;
  showProductMessage("Guardando producto...");

  const payload = {juego, paquete, precio};

  const result = id
    ? await db.from("productos").update(payload).eq("id",id)
    : await db.from("productos").insert({...payload,activo:true});

  saveProduct.disabled = false;

  if(result.error){
    console.error("Error al guardar producto:", result.error);
    showProductMessage(
      result.error.code === "23505"
        ? "Ese paquete ya existe para este juego."
        : "No se pudo guardar. Revisá los permisos y los datos.",
      "error"
    );
    return;
  }

  resetProductForm();
  showProductMessage("Producto guardado correctamente.", "success");
  await loadProducts();
});

productsList.addEventListener("click", async e => {
  const editButton = e.target.closest("[data-edit-product]");
  const toggleButton = e.target.closest("[data-toggle-product]");

  if(editButton){
    const product = products.find(p => p.id === editButton.dataset.editProduct);
    if(!product) return;

    document.getElementById("productId").value = product.id;
    document.getElementById("productGame").value = product.juego;
    document.getElementById("productName").value = product.paquete;
    document.getElementById("productPrice").value = product.precio;
    saveProduct.textContent = "Guardar cambios";
    document.getElementById("cancelProductEdit").classList.remove("hidden");
    showProductMessage("Editando producto: " + product.paquete);
    productForm.scrollIntoView({behavior:"smooth",block:"center"});
    return;
  }

  if(toggleButton){
    const product = products.find(p => p.id === toggleButton.dataset.toggleProduct);
    if(!product) return;

    const nextState = !product.activo;
    const action = nextState ? "activar" : "desactivar";

    if(!confirm(`¿Querés ${action} ${product.paquete}?`)) return;

    toggleButton.disabled = true;

    const {error} = await db
      .from("productos")
      .update({activo:nextState})
      .eq("id",product.id);

    toggleButton.disabled = false;

    if(error){
      console.error("Error al cambiar estado:", error);
      showProductMessage("No se pudo cambiar el estado del producto.", "error");
      return;
    }

    showProductMessage("Estado del producto actualizado.", "success");
    await loadProducts();
  }
});

document.getElementById("cancelProductEdit").addEventListener("click", () => {
  resetProductForm();
  showProductMessage("Edición cancelada.");
});

document.getElementById("refreshProducts").addEventListener("click", loadProducts);

const ordersTab = document.getElementById("ordersTab");
const productsTab = document.getElementById("productsTab");
const ordersTabButton = document.getElementById("ordersTabButton");
const productsTabButton = document.getElementById("productsTabButton");

function showAdminTab(tab){
  const showOrders = tab === "orders";

  ordersTab.classList.toggle("hidden", !showOrders);
  productsTab.classList.toggle("hidden", showOrders);

  ordersTabButton.classList.toggle("active", showOrders);
  productsTabButton.classList.toggle("active", !showOrders);
}

ordersTabButton.addEventListener("click", () => showAdminTab("orders"));
productsTabButton.addEventListener("click", () => showAdminTab("products"));

(async()=>{
  if(!db){
    message.textContent = "Error: no se encontró la configuración de Supabase.";
    return;
  }

  const {data:{session}} = await db.auth.getSession();
  if(session && await verifyAdmin()){
    await showDashboard();
  }else if(session){
    await db.auth.signOut();
  }
})();
})();
</script>
<script src="js/admin-precios.js"></script>
</body>
</html>
