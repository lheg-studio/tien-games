name: Desplegar función de pedidos

on:
  push:
    branches:
      - master
    paths:
      - 'supabase/functions/registrar-pedido/**'
      - 'supabase/config.toml'
      - '.github/workflows/desplegar-supabase.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Desplegar función registrar-pedido
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy registrar-pedido \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
